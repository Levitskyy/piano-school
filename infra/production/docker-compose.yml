name: piano-school

# Прод-стек: только nginx публикует порты 80/443.
# API, web, PostgreSQL и Redis доступны только внутри сети compose.
# Secrets читаются из /opt/piano-school/.env (создаётся на сервере, не в git).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: piano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: piano_school
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano -d piano_school"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://piano:${POSTGRES_PASSWORD}@postgres:5432/piano_school
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      FRONTEND_URL: ${PUBLIC_BASE_URL}
      YOOKASSA_RETURN_URL: ${PUBLIC_BASE_URL}
      CORS_ORIGINS: ${PUBLIC_BASE_URL}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  worker:
    build:
      context: ../../apps/api
    restart: unless-stopped
    command: uv run --no-dev arq app.worker.WorkerSettings
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://piano:${POSTGRES_PASSWORD}@postgres:5432/piano_school
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      FRONTEND_URL: ${PUBLIC_BASE_URL}
      YOOKASSA_RETURN_URL: ${PUBLIC_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      API_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./selfsigned.crt:/etc/nginx/ssl/selfsigned.crt:ro
      - ./selfsigned.key:/etc/nginx/ssl/selfsigned.key:ro
      - ./logs/access.log:/var/log/nginx/access.log
      - ./logs/error.log:/var/log/nginx/error.log
    depends_on:
      - web
      - api
    logging: *logging

volumes:
  pgdata:
  redisdata:
