# Прокси только на web/API внутри compose. Порты 80/443 публикует nginx.
# Клиентские IP для rate limiting: docker-сеть 172.16.0.0/12 не учитываем.
limit_req_zone $binary_remote_addr zone=general:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

map $remote_addr $client_ip_real {
    default $remote_addr;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name levickaya.ru www.levickaya.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name levickaya.ru www.levickaya.ru;

    # Файлы называются исторически; внутри лежит сертификат Let's Encrypt,
    # который обновляется certbot и копируется хуком в эти же файлы.
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    include /etc/nginx/snippets/tls-params.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    server_tokens off;

    limit_conn conn 20;
    limit_req zone=general burst=40 nodelay;

    # API и auth-routes: жёсткий лимит против перебора и злоупотреблений.
    location ~ ^/api/(auth|payments) {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://web:3000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://web:3000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Next.js: страницы, статические файлы, server actions.
    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/snippets/proxy.conf;
    }
}
