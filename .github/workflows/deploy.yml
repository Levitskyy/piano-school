name: Deploy to VPS

on:
  push:
    branches: [master]

permissions:
  contents: read

# Не давать двум деплоям одновременно трогать один и тот же стек на сервере.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Повторно прогоняем те же проверки перед деплоем: workflow CI на push master
  # срабатывает параллельно, и полагаться на другой workflow в GitHub нельзя.
  # Список шагов синхронизирован с .github/workflows/ci.yml.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.4"
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run pytest
        working-directory: apps/api
      - name: Audit Python dependencies
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes \
            | uvx --from pip-audit==2.10.1 pip-audit -r /dev/stdin --disable-pip --no-deps
      - name: Validate production Compose config
        working-directory: .
        # Compose ожидает корневой .env (env_file в сервисах); в CI его нет.
        run: |
          touch .env
          docker compose --env-file infra/production/.env.example -f infra/production/docker-compose.yml config --quiet
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: 193.233.88.115
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /opt/piano-school
            SHA="${{ github.sha }}"

            # Подтягиваем именно тот коммит, который прошёл проверки в CI.
            # -B master: перезаписываем локальную ветку (в т.ч. при detached HEAD).
            echo "==> fetch $SHA"
            # Ветка, а не произвольный SHA: сервер получает origin/master и не висит на fetch по SHA.
            timeout 180 git fetch origin master
            echo "==> checkout"
            git checkout -B master "$SHA"

            # .env, самоподписанный сертификат и логи остаются на сервере
            # (они в .gitignore и не перезаписываются при checkout).
            mkdir -p infra/production/logs
            touch infra/production/logs/access.log infra/production/logs/error.log

            DC="docker compose --env-file .env -f infra/production/docker-compose.yml"
            echo "==> build and start"
            timeout 900 $DC up -d --build --remove-orphans
            echo "==> migrate"
            timeout 180 $DC exec -T api uv run --no-dev alembic upgrade head

            # Здоровье сайта и API проверяем уже после деплоя, провал — красный workflow.
            echo "==> smoke"
            # Порт 3000 не проброшен на хост — проверяем изнутри сети compose.
            timeout 30 $DC exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            echo "Deployed $SHA"
