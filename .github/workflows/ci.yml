name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes \
            | uvx --from pip-audit==2.10.1 pip-audit -r /dev/stdin --disable-pip --no-deps
      - name: Validate production Compose config
        working-directory: .
        # Compose ожидает корневой .env (env_file в сервисах); в CI его нет.
        run: |
          touch .env
          docker compose --env-file infra/production/.env.example -f infra/production/docker-compose.yml config --quiet

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build
